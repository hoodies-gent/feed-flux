<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 981 644" width="981" height="644" role="img" aria-labelledby="t d">
  <title id="t">Inside the agent harness</title>
  <desc id="d">The harness assembles bounded context from the email in focus and relevant preferences. The model proposes a tool call. The harness applies run-level limits, pauses sensitive actions for approval with a durable checkpoint, returns edits and rejections to the model, runs idempotent tools, writes preferences only after approval, and records a trace that feeds the eval suite.</desc>
  <style>
    
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .bg { fill: #0d1117; }
    .zone-model { fill: #121d33; stroke: #35508a; stroke-width: 1.5; }
    .zone-code { fill: #11241a; stroke: #2f6a45; stroke-width: 1.5; }
    .zone-label-model { fill: #8fb0f2; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
    .zone-label-code { fill: #7fcf9c; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
    .box { fill: #161b22; stroke: #3a424d; stroke-width: 1.2; }
    .warn { fill: #2b2210; stroke: #9a7425; stroke-width: 1.4; }
    .t1 { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .t2 { font-size: 12.5px; text-anchor: middle; fill: #a3adba; }
    .cap { font-size: 12.5px; fill: #a3adba; }
    .edge { stroke: #8b949e; stroke-width: 1.5; fill: none; }
    .edge-dash { stroke: #8b949e; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .ah { fill: #8b949e; }
    .lbl { font-size: 12.5px; fill: #a3adba; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="981" height="644" rx="12"/>

  <!-- harness frame, then the model zone nested inside it -->
  <rect class="zone-code" x="124" y="126" width="825" height="324" rx="12"/>
  <text class="zone-label-code" x="536.5" y="152" text-anchor="middle">AGENT HARNESS</text>
  <rect class="zone-model" x="144" y="304" width="240" height="126" rx="12"/>
  <text class="zone-label-model" x="164" y="326">MODEL</text>

  <!-- boxes -->
  <rect class="box" x="144" y="210" width="240" height="68" rx="8"/>
  <text class="t1" x="264.0" y="239">Bounded context</text>
  <text class="t2" x="264.0" y="258">email in focus + preferences</text>
  <rect class="box" x="164" y="342" width="200" height="68" rx="8"/>
  <text class="t1" x="264.0" y="371">LLM: next tool or reply</text>
  <text class="t2" x="264.0" y="390">any provider, swappable</text>
  <path class="box" d="M556 244 L610 210 L664 244 L610 278 Z"/>
  <text class="t1" x="610" y="240" style="font-size:13.5px">Sensitive</text>
  <text class="t1" x="610" y="257" style="font-size:13.5px">action?</text>
  <rect class="box" x="729" y="210" width="200" height="68" rx="8"/>
  <text class="t1" x="829.0" y="239">Run tool</text>
  <text class="t2" x="829.0" y="258">idempotent, safe to replay</text>
  <rect class="warn" x="515" y="342" width="190" height="68" rx="8"/>
  <text class="t1" x="610.0" y="371">Pause for approval</text>
  <text class="t2" x="610.0" y="390">you approve, edit or reject</text>

  <!-- preference memory -->
  <path class="box" d="M89 41 a95.0 9 0 0 1 190 0 V85 a95.0 9 0 0 1 -190 0 Z"/>
  <path class="box" d="M89 41 a95.0 9 0 0 0 190 0" style="fill:none"/>
  <text class="t1" x="184" y="63" style="font-size:14px">Preference memory</text>
  <text class="t2" x="184" y="79">you can edit or forget</text>

  <!-- checkpoint store -->
  <path class="box" d="M515 491 a95.0 9 0 0 1 190 0 V535 a95.0 9 0 0 1 -190 0 Z"/>
  <path class="box" d="M515 491 a95.0 9 0 0 0 190 0" style="fill:none"/>
  <text class="t1" x="610" y="514" style="font-size:14px">Checkpoint store</text>
  <text class="t2" x="610" y="530">resumes after a restart</text>

  <!-- trace strip -->
  <rect class="box" x="124" y="566" width="825" height="46" rx="8"/>
  <text class="t1" x="536.5" y="586" style="font-size:14px">Run and event trace</text>
  <text class="t2" x="536.5" y="602">records every model call, tool call and approval; feeds the eval suite</text>

  <!-- legend -->
  <path class="edge" d="M304 502 h28"/>
  <text class="lbl" x="342" y="506">control flow</text>
  <path class="edge-dash" d="M304 522 h28"/>
  <text class="lbl" x="342" y="526">state and records</text>

  <!-- arrows and labels: drawn last so fills never cover arrowheads -->
  <text class="lbl" x="32" y="234">your message</text>
  <path class="edge" d="M32 244 H143" marker-end="url(#arr)"/>
  <path class="edge" d="M340 278 V341" marker-end="url(#arr)"/>

  <path class="edge" d="M364 362 H406 V244 H555" marker-end="url(#arr)"/>
  <text class="lbl" x="481.0" y="234" text-anchor="middle">proposed tool call</text>

  <path class="edge" d="M664 244 H728" marker-end="url(#arr)"/>
  <text class="lbl" x="674" y="235">no</text>

  <path class="edge" d="M610 278 V341" marker-end="url(#arr)"/>
  <text class="lbl" x="619" y="314.0">yes</text>

  <path class="edge" d="M705 376 H829 V279" marker-end="url(#arr)"/>
  <text class="lbl" x="713" y="368">approve</text>

  <path class="edge" d="M515 398 H365" marker-end="url(#arr)"/>
  <text class="lbl" x="449.5" y="378" text-anchor="middle">edit or reject</text>
  <text class="lbl" x="449.5" y="392" text-anchor="middle">returns to the model</text>

  <path class="edge" d="M829 210 V186 H344 V209" marker-end="url(#arr)"/>
  <text class="lbl" x="586.5" y="178" text-anchor="middle">next step, within run limits (steps, tokens, retries)</text>

  <path class="edge-dash" d="M610 410 V481" marker-end="url(#arr)"/>
  <text class="lbl" x="620" y="470">state saved every step</text>
  <path class="edge-dash" d="M264 450 V565" marker-end="url(#arr)"/>

  <path class="edge-dash" d="M184 94 V209" marker-end="url(#arr)"/>
  <text class="lbl" x="194" y="118">relevant preferences</text>
  <path class="edge-dash" d="M899 210 V63 H280" marker-end="url(#arr)"/>
  <text class="lbl" x="589.0" y="55" text-anchor="middle">remember or forget, after approval</text>
</svg>
